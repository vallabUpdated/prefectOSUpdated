<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrefectOS</title>
<meta name="description" content="PrefectOS — governed document processing for BFSI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background:#fff;color:#101D33;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:24px;text-align:center;
  }
  .logo{
    width:min(340px,70vw);height:auto;display:block;
    opacity:0;transform:scale(.98);
    animation:appear .6s ease .1s forwards;
  }
  .actions{
    opacity:0;animation:appear .6s ease .45s forwards;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .enter{
    display:inline-block;text-decoration:none;
    font-weight:600;font-size:17px;color:#fff;
    background:#146B45;padding:13px 34px;border-radius:8px;
  }
  .enter:hover{background:#0F5636}
  .quiet{font-size:14.5px;color:#6B7486;text-decoration:none}
  .quiet:hover{color:#101D33;text-decoration:underline}
  a:focus-visible{outline:2px solid #146B45;outline-offset:3px}
  @keyframes appear{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .logo,.actions{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
  <img class="logo" src="logo.jpeg" alt="PrefectOS — Progress Optimized">
  <div class="actions">
    <a class="enter" href="https://app.prefectos.ai">Launch Site</a>
    
  </div>
</body>
</html>
